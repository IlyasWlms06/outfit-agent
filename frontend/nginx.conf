server {
    listen 8080;

    # Website: index.html, script.js en style.css
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Vragen aan de API doorsturen naar de backend
    location /api/ {
        proxy_pass http://backend:5000;
    }

    # Foto's komen ook van de backend
    location /fotos/ {
        proxy_pass http://backend:5000;
    }
}
