name: Outfit Agent CI Pipeline

# Bij elke push en pull request
on:
  push:
  pull_request:

jobs:
  # Job 1: Docker images bouwen
  docker-build:
    runs-on: ubuntu-latest
    name: 🐳 Build Docker Images

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: outfit-backend:ci

      - name: 🐳 Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: outfit-frontend:ci

  # Job 2: Stack starten en endpoints testen (via de frontend, net zoals de browser)
  stack-test:
    runs-on: ubuntu-latest
    needs: docker-build
    name: 🧪 Start stack en test endpoints

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🚀 Start stack (zoals in de README)
        run: docker compose up -d --build

      - name: ⏳ Wachten tot de app klaar is
        run: |
          for i in $(seq 1 30); do
            if curl -s --fail http://localhost:8080/api/health; then
              echo ""
              echo "✅ App draait"
              exit 0
            fi
            sleep 1
          done
          echo "❌ App start niet"
          docker compose logs
          exit 1

      - name: 🔍 Test website
        run: curl -s --fail -o /dev/null http://localhost:8080/

      - name: 🔍 Test aanbevelingen
        run: |
          curl -s --fail "http://localhost:8080/api/aanbevelingen?gender=vrouw&gelegenheid=formeel&temperatuur=5&regen=true"
          echo ""
          echo "✅ Aanbevelingen werken"

      - name: 🔍 Test foute invoer (moet 400 geven)
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080/api/aanbevelingen?gender=kind")
          echo "Status: $status"
          test "$status" = "400"

      - name: 🧹 Stack stoppen
        if: always()
        run: docker compose down
